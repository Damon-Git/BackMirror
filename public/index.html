<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BackMirror</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="desktop-shell">
    <main class="desktop-layout">
      <section class="viewer-panel" aria-label="实时摄像头预览">
        <video id="remoteVideo" class="preview-video mirrored" autoplay playsinline muted></video>
        <div id="desktopCountdown" class="countdown-overlay" hidden>
          <strong id="desktopCountdownNumber">3</strong>
          <span>准备拍照</span>
        </div>
        <div id="emptyState" class="empty-state">
          <strong>等待手机摄像头连接</strong>
          <span>请用同一Wifi下手机扫描二维码。</span>
        </div>
      </section>

      <aside class="control-panel">
        <div class="brand-row">
          <div>
            <h1>BackMirror</h1>
            <p>能拍后背，相片不上传，保护隐私</p>
          </div>
          <span id="statusBadge" class="status-badge waiting">等待中</span>
        </div>

        <div class="qr-card">
          <img id="qrImage" alt="手机连接二维码" />
          <div class="mobile-link-row">
            <input id="mobileUrl" readonly aria-label="手机摄像头链接" />
            <button id="copyLink" type="button">复制</button>
          </div>
        </div>

        <div class="toolbar" aria-label="电脑端控制">
          <button id="captureBtn" class="primary" type="button" disabled>拍照</button>
          <button id="mirrorBtn" type="button">镜像开启</button>
          <button id="newRoomBtn" type="button">新房间</button>
        </div>

        <div class="quality-panel" aria-label="摄像头画质">
          <div>
            <span>手机摄像头</span>
            <strong id="cameraResolution">等待中</strong>
          </div>
          <div>
            <span>电脑预览</span>
            <strong id="previewResolution">等待中</strong>
          </div>
        </div>

        <div id="photoPanel" class="photo-panel" hidden>
          <div id="photoLoading" class="photo-loading" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <strong>正在生成高清照片...</strong>
            <p>手机端正在本地生成照片并传回电脑。</p>
          </div>
          <img id="photoPreview" alt="拍摄照片预览" />
          <p id="phoneSaveHint" class="save-hint" hidden>
            照片已发送到手机。请在手机端点击“保存或分享”，保存图片或发送到其他 App。
          </p>
          <div class="save-actions">
            <a id="downloadLink" class="download-link" download="backmirror-capture.jpg">保存到电脑</a>
            <button id="savePhoneBtn" type="button">发送到手机</button>
          </div>
        </div>

        <p class="disclaimer">
          BackMirror 只帮助你在本地拍摄图像。相片不上传到服务端；它不提供诊断、治疗，也不能替代专业医疗建议。<a href="/privacy.html" target="_blank" rel="noopener">隐私说明</a>
        </p>
      </aside>
    </main>

    <canvas id="captureCanvas" hidden></canvas>
    <script type="module" src="/desktop.js"></script>
  </body>
</html>
